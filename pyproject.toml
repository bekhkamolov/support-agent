[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "Customer-support AI agent with RAG, tool calling and an evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "pydantic-ai-slim>=2.55,<3",
]

[project.optional-dependencies]
# pydantic-ai's Mistral model imports httpx without declaring it, so it is listed here.
mistral = ["mistralai>=2.9.2", "pydantic-ai-slim[mistral]>=2.55,<3", "httpx>=0.27"]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
